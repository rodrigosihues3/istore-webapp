<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments/heads :: cabeceraPrincipal('iStore - Operaciones')}"></head>

<body class="bg-light d-flex flex-column min-vh-100">

  <div class="d-flex flex-grow-1 overflow-hidden">

    <aside
      class="bg-white border-end shadow-sm d-flex flex-column flex-shrink-0 p-3 sidebar-container position-fixed h-100"
      style="z-index: 1000; width: 260px;">

      <a th:href="@{/empleado}" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-decoration-none px-2">
        <span class="fs-4 fw-bold text-primary">iStore Ops</span>
      </a>

      <hr class="text-secondary">

      <ul class="nav nav-pills flex-column mb-auto">
        <li class="nav-item">
          <a href="#" class="nav-link nav-link-admin active d-flex align-items-center"
            onclick="cargarVista('dashboard', null, this)">
            <i class="bi bi-speedometer2 me-2"></i>
            Resumen
          </a>
        </li>

        <li class="nav-item mt-3 mb-1">
          <span class="text-uppercase text-tertiary fw-bold px-2" style="font-size: 0.75rem;">Operaciones</span>
        </li>

        <li>
          <a href="#" class="nav-link nav-link-admin d-flex align-items-center"
            onclick="cargarVista('pedidos', '/empleado/pedidos/tabla', this)">
            <i class="bi bi-list-check me-2"></i>
            Cola de Pedidos
          </a>
        </li>

        <li>
          <a href="#" class="nav-link nav-link-admin d-flex align-items-center"
            onclick="cargarVista('inventario', '/empleado/inventario/tabla', this)">
            <i class="bi bi-box-seam me-2"></i>
            Consultar Stock
          </a>
        </li>
      </ul>

      <hr class="text-secondary">

      <div class="d-flex flex-column gap-2">
        <div class="mt-3 text-center small text-muted">
          <span sec:authentication="principal.usuario.nombres">Empleado</span>
        </div>
        <a th:href="@{/}"
          class="btn btn-outline-secondary btn-sm w-100 d-flex align-items-center justify-content-center">
          <i class="bi bi-house-door me-2"></i> Ir a la Tienda
        </a>
        <form th:action="@{/cerrar-sesion}" method="post" class="w-100">
          <button type="submit"
            class="btn btn-outline-danger btn-sm w-100 d-flex align-items-center justify-content-center">
            <i class="bi bi-box-arrow-right me-2"></i> Cerrar Sesión
          </button>
        </form>
      </div>
    </aside>

    <main class="flex-grow-1 bg-light overflow-auto" style="margin-left: 260px; height: 100vh;">
      <div class="container-fluid p-4 h-100 d-flex flex-column">

        <div id="vista-dashboard" class="h-100 w-100 fade-in">
          <h2 class="fw-bold text-dark mb-4">Tablero Operativo</h2>

          <div class="row g-4">
            <div class="col-md-4">
              <div class="card shadow-sm border-0 h-100">
                <div class="card-body d-flex align-items-center">
                  <div class="bg-warning bg-opacity-10 text-warning p-3 rounded-circle me-3">
                    <i class="bi bi-clock-history fs-2"></i>
                  </div>
                  <div>
                    <h6 class="text-muted text-uppercase mb-1" style="font-size: 0.8rem;">Pendientes</h6>
                    <h2 class="mb-0 fw-bold text-dark" th:text="${cantPendientes}">0</h2>
                  </div>
                </div>
                <div class="card-footer bg-white border-0">
                  <a href="#"
                    onclick="cargarVista('pedidos', '/empleado/pedidos/tabla', document.querySelectorAll('.nav-link')[1])"
                    class="text-decoration-none text-warning small fw-bold">Atender ahora <i
                      class="bi bi-arrow-right"></i></a>
                </div>
              </div>
            </div>

            <div class="col-md-4">
              <div class="card shadow-sm border-0 h-100">
                <div class="card-body d-flex align-items-center">
                  <div class="bg-primary bg-opacity-10 text-primary p-3 rounded-circle me-3">
                    <i class="bi bi-box-seam fs-2"></i>
                  </div>
                  <div>
                    <h6 class="text-muted text-uppercase mb-1" style="font-size: 0.8rem;">Por Entregar</h6>
                    <h2 class="mb-0 fw-bold text-dark" th:text="${cantConfirmados}">0</h2>
                  </div>
                </div>
                <div class="card-footer bg-white border-0">
                  <a href="#"
                    onclick="cargarVista('pedidos', '/empleado/pedidos/tabla', document.querySelectorAll('.nav-link')[1])"
                    class="text-decoration-none text-primary small fw-bold">Gestionar entregas <i
                      class="bi bi-arrow-right"></i></a>
                </div>
              </div>
            </div>

            <div class="col-md-4">
              <div class="card shadow-sm border-0 h-100">
                <div class="card-body d-flex align-items-center">
                  <div class="bg-success bg-opacity-10 text-success p-3 rounded-circle me-3">
                    <i class="bi bi-check-circle fs-2"></i>
                  </div>
                  <div>
                    <h6 class="text-muted text-uppercase mb-1" style="font-size: 0.8rem;">Entregados</h6>
                    <h2 class="mb-0 fw-bold text-dark" th:text="${cantEntregados}">0</h2>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div id="vista-dinamica" class="d-none h-100 w-100">
          <div id="contenido-dinamico-ajax" class="h-100">
          </div>
        </div>

      </div>
    </main>

  </div>

  <div class="modal fade" id="modalDetalle" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content" id="contenido-modal"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <style>
    .nav-link-admin {
      color: #6c757d;
    }

    .nav-link-admin:hover {
      color: #0d6efd;
      background-color: #f8f9fa;
    }

    .nav-link-admin.active {
      color: #0d6efd;
      background-color: #e7f1ff;
      font-weight: 600;
    }
  </style>
  <script th:src="@{/js/empleado/empleado.js}"></script>

</body>

</html>
