<div th:fragment="tablaPedidos" class="animate__animated animate__fadeIn h-100 d-flex flex-column">

  <div class="d-flex justify-content-between align-items-center mb-4">
    <h3 class="fw-bold text-dark mb-0">Cola de Atención</h3>
    <button class="btn btn-primary btn-sm" onclick="cargarTabla()">
      <i class="bi bi-arrow-clockwise me-1"></i> Actualizar
    </button>
  </div>

  <div th:if="${mensajeExito}" class="alert alert-success alert-dismissible fade show" role="alert">
    <i class="bi bi-check-circle me-2"></i> <span th:text="${mensajeExito}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>
  <div th:if="${mensajeError}" class="alert alert-danger alert-dismissible fade show" role="alert">
    <i class="bi bi-exclamation-triangle me-2"></i> <span th:text="${mensajeError}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>

  <div class="card shadow-sm border-0 flex-grow-1 overflow-hidden">
    <div class="card-body p-0 d-flex flex-column h-100">
      <div class="table-responsive flex-grow-1">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light sticky-top">
            <tr>
              <th>ID</th>
              <th>Fecha</th>
              <th>Cliente</th>
              <th>Total</th>
              <th>Estado</th>
              <th class="text-center">Acciones</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="p : ${pedidos}">
              <td class="fw-bold text-secondary">#<span th:text="${p.idPedido}"></span></td>
              <td>
                <div th:text="${#temporals.format(p.fechaCreacion, 'dd/MM/yyyy')}"></div>
                <small class="text-muted" th:text="${#temporals.format(p.fechaCreacion, 'HH:mm')}"></small>
              </td>
              <td>
                <div class="fw-medium" th:text="${p.usuario.nombres + ' ' + p.usuario.apellidos}"></div>
                <small class="text-muted" th:text="${p.usuario.dni}">DNI</small>
              </td>
              <td class="fw-bold text-success" th:text="'S/ ' + ${#numbers.formatDecimal(p.total, 1, 2, 'COMMA')}"></td>
              <td>
                <span class="badge rounded-pill"
                  th:classappend="${p.estadoCompra.nombre == 'PENDIENTE' ? 'bg-warning text-dark' : (p.estadoCompra.nombre == 'CONFIRMADO' ? 'bg-primary' : 'bg-success')}"
                  th:text="${p.estadoCompra.nombre}">Estado</span>
              </td>
              <td class="text-center">
                <div class="btn-group shadow-sm">
                  <button class="btn btn-sm btn-light border" th:onclick="'verDetalle(' + ${p.idPedido} + ')'"
                    title="Ver Items">
                    <i class="bi bi-eye"></i>
                  </button>

                  <button th:if="${p.estadoCompra.nombre == 'PENDIENTE'}" class="btn btn-sm btn-success"
                    th:onclick="'if(confirm(\'Seguro de confirmar el pedido?\')) cambiarEstado(' + ${p.idPedido} + ', \'CONFIRMAR\')'"
                    title="Confirmar">
                    <i class="bi bi-check-lg"></i>
                  </button>

                  <button th:if="${p.estadoCompra.nombre == 'CONFIRMADO'}" class="btn btn-sm btn-primary"
                    th:onclick="'if(confirm(\'¿Seguro de entregar el pedido?\')) cambiarEstado(' + ${p.idPedido} + ', \'ENTREGAR\')'"
                    title="Entregar">
                    <i class="bi bi-box-seam"></i>
                  </button>

                  <button class="btn btn-sm btn-outline-danger"
                    th:if="${p.estadoCompra.nombre != 'ENTREGADO' and p.estadoCompra.nombre != 'CANCELADO'}"
                    th:onclick="'if(confirm(\'¿Seguro de cancelar?\')) cambiarEstado(' + ${p.idPedido} + ', \'CANCELAR\')'"
                    title="Cancelar">
                    <i class="bi bi-x-lg"></i>
                  </button>
                </div>
              </td>
            </tr>
            <tr th:if="${#lists.isEmpty(pedidos)}">
              <td colspan="6" class="text-center py-5 text-muted">
                <i class="bi bi-inbox fs-1 d-block mb-2"></i>
                Sin pedidos pendientes.
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
