<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments/heads :: cabeceraPrincipal('iStore - Panel Admin')}"></head>

<body class="bg-light d-flex flex-column min-vh-100" th:attr="data-usuario-actual=${#authentication.name}">

  <div class="d-flex flex-grow-1 overflow-hidden">

    <aside
      class="bg-white border-end shadow-sm d-flex flex-column flex-shrink-0 p-3 sidebar-container position-fixed h-100"
      style="z-index: 1000;">

      <a th:href="@{/admin}" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-decoration-none px-2">
        <span class="fs-4 fw-bold text-primary">iStore Admin</span>
      </a>

      <hr class="text-secondary">

      <ul class="nav nav-pills flex-column mb-auto">

        <li class="nav-item">
          <a href="#" class="nav-link nav-link-admin active d-flex align-items-center"
            onclick="cargarVista('dashboard', null, this)">
            <i class="bi bi-bar-chart-line-fill me-2"></i>
            Reportes
          </a>
        </li>

        <li class="nav-item mt-3 mb-1">
          <span class="text-uppercase text-tertiary fw-bold px-2" style="font-size: 0.75rem;">Gestión</span>
        </li>

        <li>
          <a href="#" class="nav-link nav-link-admin d-flex align-items-center"
            onclick="cargarVista('pedidos', '/admin/pedidos/tabla', this)">
            <i class="bi bi-bag-check-fill me-2"></i>
            Pedidos
          </a>
        </li>

        <li>
          <a href="#" class="nav-link nav-link-admin d-flex align-items-center"
            onclick="cargarVista('usuarios', '/admin/usuarios/tabla', this)">
            <i class="bi bi-people-fill me-2"></i>
            Usuarios
          </a>
        </li>

        <li>
          <a href="#" class="nav-link nav-link-admin d-flex align-items-center"
            onclick="cargarVista('productos', '/admin/productos/tabla', this)">
            <i class="bi bi-box-seam-fill me-2"></i>
            Productos
          </a>
        </li>

        <!-- <li>
          <a href="#" class="nav-link nav-link-admin d-flex align-items-center"
            onclick="cargarVista('inventario', '/admin/inventario/tabla', this)">
            <i class="bi bi-boxes me-2"></i>
            Inventario
          </a>
        </li> -->

        <li>
          <a href="#" class="nav-link nav-link-admin d-flex align-items-center"
            onclick="cargarVista('roles', '/admin/roles/tabla', this)">
            <i class="bi bi-receipt me-2"></i>
            Roles
          </a>
        </li>

        <li>
          <a href="#" class="nav-link nav-link-admin d-flex align-items-center"
            onclick="cargarVista('colores', '/admin/colores/tabla', this)">
            <i class="bi bi-palette-fill me-2"></i>
            Colores
          </a>
        </li>

        <li>
          <a href="#" class="nav-link nav-link-admin d-flex align-items-center"
            onclick="cargarVista('categorias', '/admin/categorias/tabla', this)">
            <i class="bi bi-collection-fill me-2"></i>
            Categorias
          </a>
        </li>

        <li>
          <a href="#" class="nav-link nav-link-admin d-flex align-items-center"
            onclick="cargarVista('estadosCompras', '/admin/estados-compras/tabla', this)">
            <i class="bi bi-basket2-fill me-2"></i>
            Estados para compras
          </a>
        </li>

        <li>
          <a href="#" class="nav-link nav-link-admin d-flex align-items-center"
            onclick="cargarVista('estadosPagos', '/admin/estados-pagos/tabla', this)">
            <i class="bi bi-credit-card-fill me-2"></i>
            Estados para pagos
          </a>
        </li>

        <li>
          <a href="#" class="nav-link nav-link-admin d-flex align-items-center"
            onclick="cargarVista('metodosPagos', '/admin/metodos-pagos/tabla', this)">
            <i class="bi bi-cash-stack me-2"></i>
            Metodos de pago
          </a>
        </li>

        <li>
          <a href="#" class="nav-link nav-link-admin d-flex align-items-center"
            onclick="cargarVista('tiposComprobantes', '/admin/tipos-comprobantes/tabla', this)">
            <i class="bi bi-receipt me-2"></i>
            Tipos de comprobantes
          </a>
        </li>
      </ul>

      <hr class="text-secondary">

      <div class="d-flex flex-column gap-2">
        <a th:href="@{/}"
          class="btn btn-outline-secondary btn-sm w-100 d-flex align-items-center justify-content-center">
          <i class="bi bi-house-door me-2"></i> Ir a la Tienda
        </a>

        <form th:action="@{/logout}" method="post" class="w-100">
          <button type="submit" class="btn btn-danger btn-sm w-100 d-flex align-items-center justify-content-center">
            <i class="bi bi-box-arrow-right me-2"></i> Cerrar Sesión
          </button>
        </form>
      </div>

      <div class="mt-3 text-center small text-muted">
        <span th:text="${#authentication.name}">Admin</span>
      </div>
    </aside>


    <main class="flex-grow-1 bg-light overflow-auto" style="margin-left: 260px; height: 100vh;">

      <div class="container-fluid p-4 h-100 d-flex flex-column">

        <div id="vista-dashboard" class="h-100 w-100 fade-in d-flex flex-column">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="fw-bold text-primary">Dashboard General</h2>
          </div>

          <div class="card shadow-sm border-0 flex-grow-1 overflow-hidden" style="border-radius: var(--radius-xl);">
            <div class="card-body p-0">
              <iframe width="100%" height="100%"
                src="https://lookerstudio.google.com/embed/reporting/be155dc8-a6e5-40ce-96e4-9b80b39cd6a3/page/QIOiF"
                frameborder="0" style="border:0;" allowfullscreen>
              </iframe>
            </div>
          </div>
        </div>

        <div id="vista-dinamica" class="d-none h-100">
          <div id="contenido-dinamico-ajax" class="h-100">
          </div>
        </div>

      </div>
    </main>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

  <script th:src="@{/js/administrador/index-admin.js}"></script>

</body>

</html>
