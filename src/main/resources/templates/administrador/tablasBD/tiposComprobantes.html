<div th:fragment="tablaTiposComprobantes" class="container-fluid animate__animated animate__fadeIn"
  th:attr="data-mostrar-modal=${mostrarModal}">
  <!-- CONTENIDO -->
  <main class="container-fluid px-4 my-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1 class="fw-bold">Tabla Tipos de Comprobantes</h1>
      <button type="button" class="btn btn-success" data-bs-toggle="modal" data-bs-target="#modalAgregar">
        <span><i class="bi bi-person-rolodex"></i><span> Agregar
      </button>
    </div>

    <!-- Tabla -->
    <div class="card shadow-sm border-0">
      <div class="card-body">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Fecha registro</th>
                <th class="text-center">Acciones</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="tipoComprobante : ${tiposComprobantes}">
                <td th:text="${tipoComprobante.idTipoComprobante}">ID</td>
                <td th:text="${tipoComprobante.nombre}">Nombres</td>
                <td th:text="${#temporals.format(tipoComprobante.fechaCreacion, 'dd/MM/yyyy HH:mm')}">Fecha registro
                </td>
                <td class="text-center">
                  <button type="button" class="btn btn-sm btn-outline-primary" data-bs-toggle="modal"
                    data-bs-target="#modalEditar" title="Editar" data-entidad="tipoComprobante"
                    th:data-id="${tipoComprobante.idTipoComprobante}" th:data-nombre="${tipoComprobante.nombre}">
                    <span><i class="bi bi-pencil-square"></i></span>
                  </button>
                  <button type="button" class="btn btn-sm btn-outline-danger" data-bs-toggle="modal"
                    data-entidad="tipoComprobante" th:data-id="${tipoComprobante.idTipoComprobante}"
                    th:data-nombre="${tipoComprobante.nombre}" data-bs-target="#modalEliminar" title="Eliminar">
                    <span><i class="bi bi-trash3-fill"></i></span>
                  </button>
                </td>
              </tr>

              <!-- En caso de estar vacios -->
              <tr th:if="${tiposComprobantes==null or #lists.isEmpty(tiposComprobantes)}">
                <td colspan="4" class="text-center text-muted py-3">
                  No hay tipos de comprobantes registrados.
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <!-- MODALES -->
  <div th:replace="~{fragments/adminBD/modalAgregarRegistro :: modalAgregarTipoComprobante}"></div>
  <div th:replace="~{fragments/adminBD/modalEditarRegistro :: modalEditarTipoComprobante}"></div>
  <div th:replace="~{fragments/adminBD/modalEliminarRegistro :: modalEliminarTipoComprobante}"></div>
</div>
