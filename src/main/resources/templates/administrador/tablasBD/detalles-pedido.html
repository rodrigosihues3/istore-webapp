<div th:fragment="contenidoDetalle" class="container-fluid animate__animated animate__fadeInRight"
  th:attr="data-mostrar-modal=${mostrarModal}">

  <main class="container-fluid px-4 my-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
      <button class="btn btn-outline-secondary btn-sm" onclick="cargarVista('pedidos', '/admin/pedidos/tabla', null)">
        <i class="bi bi-arrow-left me-2"></i>Volver a la lista
      </button>
    </div>

    <div th:if="${errorNullAgregarPedidoItem}" class="alert alert-danger alert-dismissible fade show" role="alert">
      <i class="bi bi-exclamation-triangle-fill me-2"></i> <span th:text="${errorNullAgregarPedidoItem}"></span>
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="card shadow-sm border-0 mb-4 bg-white">
      <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center py-3">
        <div class="d-flex align-items-center">
          <div class="bg-white text-dark rounded-circle d-flex justify-content-center align-items-center me-3"
            style="width: 40px; height: 40px;">
            <i class="bi bi-box-seam fs-5"></i>
          </div>
          <div>
            <small class="d-block text-white-50" style="font-size: 0.75rem;">NÚMERO DE PEDIDO</small>
            <h4 class="mb-0 fw-bold text-white">#<span th:text="${pedido.idPedido}"></span></h4>
          </div>
        </div>
        <div class="text-end">
          <small class="d-block text-white-50" style="font-size: 0.75rem;">MONTO TOTAL</small>
          <h4 class="mb-0 fw-bold text-white"
            th:text="'S/ ' + ${#numbers.formatDecimal(pedido.total, 1, 2, 'COMMA')}"></h4>
        </div>
      </div>
      <div class="card-body">
        <div class="row g-4">
          <div class="col-md-4 d-flex">
            <div class="me-3 text-secondary"><i class="bi bi-person-circle fs-3"></i></div>
            <div>
              <small class="text-uppercase text-muted fw-bold d-block mb-1">Cliente</small>
              <div class="fw-bold text-dark" th:text="${pedido.usuario?.nombres + ' ' + pedido.usuario?.apellidos}">Name
              </div>
              <div class="text-muted small"><i class="bi bi-envelope me-1"></i><span
                  th:text="${pedido.usuario?.email}">Email</span></div>
            </div>
          </div>

          <div class="col-md-4 d-flex border-start ps-4">
            <div class="me-3 text-secondary"><i class="bi bi-credit-card-2-front fs-3"></i></div>
            <div>
              <small class="text-uppercase text-muted fw-bold d-block mb-1">Estado de compra & Metodo de Pago</small>
              <div class="mb-1">
                <span class="badge rounded-pill"
                  th:classappend="${pedido.estadoCompra?.nombre == 'ENTREGADO' ? 'bg-success' : (pedido.estadoCompra?.nombre == 'CANCELADO' ? 'bg-danger' : 'bg-warning text-dark')}"
                  th:text="${pedido.estadoCompra?.nombre}">ESTADO</span>
              </div>
              <div class="small text-muted" th:text="${pedido.metodoPago?.nombre}">Método</div>
            </div>
          </div>

          <div class="col-md-4 d-flex border-start ps-4">
            <div class="me-3 text-secondary"><i class="bi bi-calendar-event fs-3"></i></div>
            <div>
              <small class="text-uppercase text-muted fw-bold d-block mb-1">Detalles</small>
              <div class="small text-dark mb-1">
                <strong>Creado:</strong> <span
                  th:text="${#temporals.format(pedido.fechaCreacion, 'dd/MM/yyyy HH:mm')}"></span>
              </div>
              <div class="small text-muted">
                <strong>Comp:</strong> <span th:text="${pedido.tipoComprobante?.nombre}">Boleta</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-3">
      <h5 class="fw-bold text-secondary"><i class="bi bi-list-check me-2"></i>Items del Pedido</h5>
      <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalAgregar">
        <i class="bi bi-plus-lg me-2"></i> Agregar Item
      </button>
    </div>

    <div class="card shadow-sm border-0">
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="bg-light">
              <tr>
                <th class="text-center py-3" style="width: 80px;">IMG</th>
                <th>Producto</th>
                <th class="text-center">Cant.</th>
                <th class="text-end">P. Unit</th>
                <th class="text-end pe-4">Subtotal</th>
                <th class="text-center">Acciones</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="item : ${pedidoItems}">
                <td class="text-center">
                  <img th:if="${item.producto?.urlImagen != null}" th:src="${item.producto.urlImagen}"
                    class="rounded border bg-white" style="width: 50px; height: 50px; object-fit: contain;" alt="Prod">
                  <div th:unless="${item.producto?.urlImagen != null}"
                    class="rounded bg-light border d-flex justify-content-center align-items-center mx-auto"
                    style="width: 50px; height: 50px;">
                    <i class="bi bi-image text-muted"></i>
                  </div>
                </td>

                <td>
                  <div class="fw-bold text-dark" th:text="${item.producto?.nombre}">Nombre Producto</div>
                  <small class="text-muted">SKU: <span th:text="${item.producto?.sku}">SKU</span></small>
                </td>

                <td class="text-center">
                  <span class="badge bg-white text-dark border fs-6 px-3" th:text="${item.cantidad}">1</span>
                </td>

                <td class="text-end text-muted" th:text="${'S/ ' + #numbers.formatDecimal(item.precio, 1, 2, 'COMMA')}">
                  0.00</td>

                <td class="text-end pe-4 fw-bold text-success"
                  th:text="${'S/ ' + #numbers.formatDecimal(item.total, 1, 2, 'COMMA')}">0.00</td>

                <td class="text-center">
                  <div class="btn-group" role="group">
                    <button type="button" class="btn btn-sm btn-outline-primary" data-bs-toggle="modal"
                      data-bs-target="#modalEditar" data-entidad="pedidoItem" th:data-id-item="${item.idPedidoItem}"
                      th:data-id-producto="${item.producto?.idProducto}" th:data-cantidad="${item.cantidad}"
                      th:data-precio="${item.precio}" title="Editar">
                      <i class="bi bi-pencil"></i>
                    </button>

                    <button type="button" class="btn btn-sm btn-outline-danger" data-bs-toggle="modal"
                      data-bs-target="#modalEliminar" data-entidad="pedidoItem" th:data-id-item="${item.idPedidoItem}"
                      th:data-producto-nombre="${item.producto?.nombre}" th:data-total-item="${item.total}"
                      title="Eliminar">
                      <i class="bi bi-trash3"></i>
                    </button>
                  </div>
                </td>
              </tr>

              <tr th:if="${#lists.isEmpty(pedidoItems)}">
                <td colspan="6" class="text-center py-5">
                  <div class="text-muted d-flex flex-column align-items-center">
                    <i class="bi bi-basket3 fs-1 mb-2"></i>
                    <span>Este pedido aún no tiene items agregados.</span>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <div th:replace="~{fragments/adminBD/modalAgregarRegistro :: modalAgregarPedidoItem}"></div>
  <div th:replace="~{fragments/adminBD/modalEditarRegistro :: modalEditarPedidoItem}"></div>
  <div th:replace="~{fragments/adminBD/modalEliminarRegistro :: modalEliminarPedidoItem}"></div>
</div>
