<div th:fragment="tablaRoles" class="container-fluid animate__animated animate__fadeIn"
  th:attr="data-mostrar-modal=${mostrarModal}">
  <!-- CONTENIDO -->
  <main class="container-fluid px-4 my-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1 class="fw-bold">Tabla Roles</h1>
      <button type="button" class="btn btn-success" data-bs-toggle="modal" data-bs-target="#modalAgregar">
        <span><i class="bi bi-database-fill-add me-2"></i><span> Agregar
      </button>
    </div>

    <!-- Tabla -->
    <div class="card shadow-sm border-0">
      <div class="card-body">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Nivel</th>
                <th>Fecha registro</th>
                <th class="text-center">Acciones</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="rol : ${roles}">
                <td th:text="${rol.idRol}">ID</td>
                <td th:text="${rol.nombre}">Nombre</td>
                <td th:text="${rol.nivel}">Nivel</td>
                <td th:text="${#temporals.format(rol.fechaCreacion, 'dd/MM/yyyy HH:mm')}">Fecha registro</td>
                <td class="text-center">
                  <button type="button" class="btn btn-sm btn-outline-primary" data-bs-toggle="modal"
                    data-bs-target="#modalEditar" title="Editar" data-entidad="rol" th:data-id="${rol.idRol}"
                    th:data-nombre="${rol.nombre}" th:data-nivel="${rol.nivel}">
                    <span><i class="bi bi-pencil-square"></i></span>
                  </button>
                  <button type="button" class="btn btn-sm btn-outline-danger" data-bs-toggle="modal" data-entidad="rol"
                    th:data-id="${rol.idRol}" th:data-nombre="${rol.nombre}" th:data-nivel="${rol.nivel}"
                    data-bs-target="#modalEliminar" title="Eliminar">
                    <span><i class="bi bi-trash3-fill"></i></span>
                  </button>
                </td>
              </tr>

              <!-- En caso de estar vacios -->
              <tr th:if="${roles==null or #lists.isEmpty(roles)}">
                <td colspan="5" class="text-center text-muted py-3">
                  No hay roles registrados.
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <!-- MODALES -->
  <div th:replace="~{fragments/adminBD/modalAgregarRegistro :: modalAgregarRol}"></div>
  <div th:replace="~{fragments/adminBD/modalEditarRegistro :: modalEditarRol}"></div>
  <div th:replace="~{fragments/adminBD/modalEliminarRegistro :: modalEliminarRol}"></div>
</div>
