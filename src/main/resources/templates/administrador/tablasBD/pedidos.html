<div th:fragment="tablaPedidos" class="container-fluid animate__animated animate__fadeIn"
  th:attr="data-mostrar-modal=${mostrarModal}">
  <!-- CONTENIDO -->
  <main class="container-fluid px-4 my-4">
    <div th:if="${errorGeneral}" class="alert alert-danger alert-dismissible fade show" role="alert">
      <span th:text="${errorGeneral}"></span>
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${errorNullAgregar}" class="alert alert-danger alert-dismissible fade show" role="alert">
      <i class="bi bi-exclamation-triangle-fill me-2"></i> <span th:text="${errorNullAgregar}"></span>
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${errorNullEditar}" class="alert alert-danger alert-dismissible fade show" role="alert">
      <i class="bi bi-exclamation-triangle-fill me-2"></i> <span th:text="${errorNullEditar}"></span>
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1 class="fw-bold">GESTIÓN DE PEDIDOS</h1>
      <button type="button" class="btn btn-success" data-bs-toggle="modal" data-bs-target="#modalAgregar">
        <span><i class="bi bi-database-fill-add me-2"></i><span> Agregar
      </button>
    </div>

    <!-- Tabla -->
    <div class="card shadow-sm border-0">
      <div class="card-body">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th>ID</th>
                <th>CLIENTE / USUARIO</th>
                <th class="text-center">TOTAL</th>
                <th>ESTADOS (Compra / Pago)</th>
                <th>MÉTODO DE PAGO / Ref. Pago</th>
                <th>FECHA</th>
                <th class="text-center">Acciones</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="pedido : ${pedidos}">
                <td class="fw-bold text-secondary" th:text="${pedido.idPedido}">ID</td>
                <td>
                  <div class="d-flex flex-column">
                    <span class="fw-bold" th:text="${pedido.usuario?.nombres + ' ' + pedido.usuario?.apellidos}">CLIENTE
                    </span>
                    <small class="text-muted">
                      <span th:text="${pedido.usuario?.email}" th:title="${pedido.usuario?.nombreUsuario}">CORREO</span>
                    </small>
                  </div>
                </td>
                <td class="fw-bold text-success"
                  th:text="${'S/. ' + #numbers.formatDecimal(pedido.total, 1, 2, 'COMMA')}">TOTAL
                </td>
                <td>
                  <div class="mb-1">
                    <span class="badge bg-light text-dark border"
                      th:text="'Compra: ' + ${pedido.estadoCompra?.nombre}">Compra</span>
                  </div>
                  <div>
                    <span class="badge"
                      th:classappend="${pedido.estadoPago?.nombre == 'PAGADO' ? 'bg-success' : 'bg-warning text-dark'}"
                      th:text="'Pago: ' + ${pedido.estadoPago?.nombre}">Pago</span>
                  </div>
                </td>
                <td>
                  <div class="fw-bold" th:text="${pedido.metodoPago?.nombre}">Metodo</div>
                  <small class="text-muted d-block text-truncate" style="max-width: 100px;"
                    th:text="${pedido.referenciaPago}" title="Referencia">Ref</small>
                </td>
                <td>
                  <div class="small" th:text="${#temporals.format(pedido.fechaCreacion, 'dd/MM/yyyy')}">FECHA</div>
                  <small class="text-muted" th:text="${#temporals.format(pedido.fechaCreacion, 'HH:mm')}">HORA</small>
                </td>
                <td class="text-center">
                  <button type="button" class="btn btn-sm btn-info text-white me-1"
                    th:onclick="'cargarVista(\'detallePedido\', \'/admin/pedidos/detalles/' + ${pedido.idPedido} + '\', null)'"
                    title="Ver Items">
                    <i class="bi bi-list-ul"></i>
                  </button>

                  <button type="button" class="btn btn-sm btn-outline-primary" data-bs-toggle="modal"
                    data-bs-target="#modalEditar" data-entidad="pedido" th:data-id="${pedido.idPedido}"
                    th:data-id-metodo-pago="${pedido.metodoPago?.idMetodoPago}"
                    th:data-id-tipo-comprobante="${pedido.tipoComprobante?.idTipoComprobante}"
                    th:data-id-estado-compra="${pedido.estadoCompra?.idEstadoCompra}" th:data-total="${pedido.total}"
                    th:data-usuario-nombreCompleto="${pedido.usuario?.nombres + ' ' + pedido.usuario?.apellidos}"
                    th:data-usuario="${pedido.usuario?.nombreUsuario}" th:data-usuario-email="${pedido.usuario?.email}"
                    th:data-id-estado-pago="${pedido.estadoPago?.idEstadoPago}"
                    th:data-referencia-pago="${pedido.referenciaPago}" title="Editar Pedido">
                    <i class="bi bi-pencil-square"></i>
                  </button>

                  <button type="button" class="btn btn-sm btn-outline-danger" data-bs-toggle="modal"
                    data-bs-target="#modalEliminar" data-entidad="pedido" th:data-id="${pedido.idPedido}"
                    th:data-metodo-pago="${pedido.metodoPago?.nombre}"
                    th:data-tipo-comprobante="${pedido.tipoComprobante?.nombre}"
                    th:data-estado-compra="${pedido.estadoCompra?.nombre}" th:data-total="${pedido.total}"
                    th:data-usuario-nombreCompleto="${pedido.usuario?.nombres + ' ' + pedido.usuario?.apellidos}"
                    th:data-usuario="${pedido.usuario?.nombreUsuario}" th:data-usuario-email="${pedido.usuario?.email}"
                    title="Eliminar Pedido">
                    <i class="bi bi-trash3"></i>
                  </button>
                </td>
              </tr>

              <!-- En caso de estar vacios -->
              <tr th:if="${pedidos==null or #lists.isEmpty(pedidos)}">
                <td colspan="11" class="text-center text-muted py-3">
                  No hay pedidos registrados.
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <!-- MODALES -->
  <div th:replace="~{fragments/adminBD/modalAgregarRegistro :: modalAgregarPedido}"></div>
  <div th:replace="~{fragments/adminBD/modalEditarRegistro :: modalEditarPedido}"></div>
  <div th:replace="~{fragments/adminBD/modalEliminarRegistro :: modalEliminarPedido}"></div>
</div>
