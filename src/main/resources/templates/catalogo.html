<div th:fragment="listaProductos" class="container animate__animated animate__fadeIn">
  <h2 class="text-center fw-bold mb-4" th:text="${tituloCatalogo}">Nuestro Catálogo</h2>

  <div class="container text-center px-4">
    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-2 row-cols-lg-4 g-4">
      <div class="col" th:each="producto : ${productos}">
        <div class="card product h-100 pb-2">
          <button type="button" class="border-0 bg-transparent p-0 w-100 btn-detalle-producto" data-bs-toggle="modal"
            data-bs-target="#modalDetalleProducto" th:data-id="${producto.idProducto}"
            th:data-nombre="${producto.nombre}" th:data-descripcion="${producto.descripcion}"
            th:data-precio="${producto.precio}" th:data-imagen="${producto.urlImagen}" th:data-stock="${producto.stock}"
            aria-label="Ver detalles">

            <img th:if="${producto.urlImagen != null}" th:src="${producto.urlImagen}" class="card-img-top product-image"
              style="object-fit: contain; height: 200px;">
            <img th:unless="${producto.urlImagen != null}" src="https://via.placeholder.com/300x300?text=No+Image"
              class="card-img-top product-image">

            <div class="card-body p-0">
              <h5 class="card-title product-title" th:text="${producto.nombre}">Nombre Producto</h5>
              <p class="card-text" th:text="${producto.categoria.nombre}">Categoría</p>
              <p class="product-price" th:text="'S/. ' + ${producto.precio}">S/. 0.00</p>
            </div>
          </button>

          <div class="card-footer bg-white border-0">
            <button class="btn btn-primary w-75 btn-agregar-carrito" th:data-id="${producto.idProducto}"
              th:disabled="${producto.stock <= 0}">
              <span th:text="${producto.stock > 0 ? 'Agregar al carrito' : 'Agotado'}">Agregar</span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <div th:if="${#lists.isEmpty(productos)}" class="alert alert-warning mt-4">
      No se encontraron productos con los criterios seleccionados.
    </div>
  </div>
</div>
