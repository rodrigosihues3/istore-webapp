<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments/heads :: cabeceraPrincipal('iStore')}"></head>

<body class="d-flex flex-column min-vh-100">

    <!-- NAVBAR SUPERIOR -->
    <header class="sticky-top">
        <!-- NAVBAR PRINCIPAL -->
        <nav th:replace="~{fragments/navbars :: navbarPrincipal}"></nav>

        <!-- NAVBAR MENÚ / CATEGORÍAS -->
        <nav th:replace="~{fragments/navbars :: navbarCategorias}"></nav>
    </header>

    <!-- CARRUSEL -->
    <section>
        <div id="heroCarousel" class="carousel slide" data-bs-ride="carousel" aria-label="Galería destacada">
            <div class="carousel-indicators">
                <button type="button" data-bs-target="#heroCarousel" data-bs-slide-to="0" class="active"
                    aria-current="true" aria-label="Slide 1"></button>
                <button type="button" data-bs-target="#heroCarousel" data-bs-slide-to="1" aria-label="Slide 2"></button>
                <button type="button" data-bs-target="#heroCarousel" data-bs-slide-to="2" aria-label="Slide 3"></button>
                <button type="button" data-bs-target="#heroCarousel" data-bs-slide-to="3" aria-label="Slide 4"></button>
                <button type="button" data-bs-target="#heroCarousel" data-bs-slide-to="4" aria-label="Slide 5"></button>
            </div>

            <div class="carousel-inner">
                <div class="carousel-item active" data-bs-interval="4500">
                    <img th:src="@{/img/carrusel-img-5.png}" class="d-block w-100" alt="Imagen 5" />
                </div>
                <div class="carousel-item" data-bs-interval="4500">
                    <img th:src="@{/img/carrusel-img-1.png}" class="d-block w-100" alt="Imagen 1" />
                </div>
                <div class="carousel-item" data-bs-interval="4500">
                    <img th:src="@{/img/carrusel-img-2.png}" class="d-block w-100" alt="Imagen 2" />
                </div>
                <div class="carousel-item" data-bs-interval="4500">
                    <img th:src="@{/img/carrusel-img-3.png}" class="d-block w-100" alt="Imagen 3" />
                </div>
                <div class="carousel-item" data-bs-interval="4500">
                    <img th:src="@{/img/carrusel-img-4.png}" class="d-block w-100" alt="Imagen 4" />
                </div>
            </div>

            <button class="carousel-control-prev" type="button" data-bs-target="#heroCarousel" data-bs-slide="prev"
                aria-label="Anterior">
                <!-- <span class="carousel-control-prev-icon" aria-hidden="true"></span> -->
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#heroCarousel" data-bs-slide="next"
                aria-label="Siguiente">
                <!-- <span class="carousel-control-next-icon" aria-hidden="true"></span> -->
            </button>
        </div>
    </section>

    <!-- LISTADO DE PRODUCTOS -->
    <main id="productos" class="py-5">
        <div class="container">
            <h2 class="text-center fw-bold mb-5">Destacados</h2>

            <div class="container px-2 px-md-4">
                <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4">

                    <div class="col" th:each="producto : ${productosDestacados}">
                        <div class="card h-100 product-card border-0 shadow-sm">

                            <button type="button" class="border-0 bg-transparent p-0 btn-detalle-producto"
                                data-bs-toggle="modal" data-bs-target="#modalDetalleProducto"
                                th:data-id="${producto.idProducto}" th:data-nombre="${producto.nombre}"
                                th:data-descripcion="${producto.descripcion}" th:data-precio="${producto.precio}"
                                th:data-imagen="${producto.urlImagen}" th:data-stock="${producto.stock}">

                                <div class="product-image-container">
                                    <img th:if="${producto.urlImagen != null}" th:src="${producto.urlImagen}"
                                        class="img-fluid h-100 object-fit-contain" alt="Producto">
                                    <div th:unless="${producto.urlImagen != null}" class="text-muted text-center">
                                        <i class="bi bi-image fs-1"></i>
                                    </div>
                                </div>

                                <div class="card-body pt-2 px-3 pb-0">
                                    <small class="text-muted text-uppercase" style="font-size: 0.7rem;"
                                        th:text="${producto.categoria?.nombre}">Categoría</small>
                                    <h5 class="product-title text-truncate" th:text="${producto.nombre}">Nombre</h5>
                                    <p class="text-muted small text-truncate" th:text="${producto.descripcion}">Desc</p>
                                </div>
                            </button>

                            <div class="card-footer bg-white border-0 pb-4 pt-2 px-3 mt-auto">
                                <div class="d-flex justify-content-between align-items-center gap-2">
                                    <span class="product-price fw-bold"
                                        th:text="'S/ ' + ${#numbers.formatDecimal(producto.precio, 1, 2, 'COMMA')}">0.00</span>

                                    <button class="btn btn-agregar-carrito"
                                        th:classappend="${producto.stock > 0 ? 'btn-primary' : 'btn-secondary'}"
                                        th:data-id="${producto.idProducto}" th:disabled="${producto.stock <= 0}">
                                        <i class="bi bi-cart-plus me-1" th:if="${producto.stock > 0}"></i>
                                        <span th:text="${producto.stock > 0 ? 'Agregar' : 'Agotado'}">Agregar</span>
                                    </button>
                                </div>
                            </div>

                        </div>
                    </div>

                </div>
            </div>

            <div class="text-center mt-5">
                <button class="btn btn-outline-primary btn-lg px-5 rounded-pill" onclick="cargarProductos({})">
                    Ver Todo el Catálogo
                </button>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer th:replace="~{fragments/footers :: footer-principal}"></footer>

    <!-- MODAL GENÉRICO -->
    <div class="modal fade" id="modalDetalleProducto" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header border-0">
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body row pb-5">
                    <div class="col-md-6 text-center mb-3 mb-md-0">
                        <img src="" alt="Producto" class="img-fluid rounded object-fit-contain"
                            style="max-height: 400px;">
                    </div>
                    <div class="col-md-6 d-flex flex-column justify-content-center">
                        <h3 class="modal-title fw-bold mb-2">Nombre Producto</h3>
                        <h4 class="text-success fw-bold mb-4" id="modalPrecio">S/. 0.00</h4>
                        <p class="text-muted mb-4" id="modalDescripcion">Descripción detallada...</p>

                        <div class="d-grid gap-2">
                            <button class="btn btn-primary btn-lg btn-agregar-modal">Agregar al carrito</button>
                            <button class="btn btn-outline-secondary" data-bs-dismiss="modal">Seguir viendo</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script th:src="@{/js/catalogo-cliente.js}"></script>
</body>

</html>
