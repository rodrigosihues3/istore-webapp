<!-- NAVBAR PRINCIPAL -->
<nav class="navbar navbar-expand-lg" th:fragment="navbarPrincipal">
    <div class="container-fluid justify-content-between">
        <a class="navbar-brand fw-semibold" th:href="@{/}"> ✌️iStore </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarScroll"
            aria-controls="navbarScroll" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarScroll">
            <ul class="navbar-nav ms-3 me-auto my-2 my-lg-0 navbar-nav-scroll" style="--bs-scroll-height: 100px;">
                <li class="nav-item me-3">
                    <a class="nav-link text-dark fw-medium" th:href="@{/tiendas}">Tiendas</a>
                </li>
                <li class="nav-item me-3">
                    <a class="nav-link text-dark fw-medium" th:href="@{/nosotros}">Nosotros</a>
                </li>
            </ul>

            <form class="d-none d-lg-flex position-absolute start-50 translate-middle-x" role="search">
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-search text-muted"></i></span>
                    <input class="form-control border-start-0 bg-light" type="search"
                        placeholder="Buscar iPhone, Mac, iPad..." aria-label="Search">
                    <button class="btn btn-outline-secondary" type="submit">Buscar</button>
                </div>
            </form>

            <form class="d-flex d-lg-none my-3" role="search">
                <input class="form-control me-2" type="search" placeholder="Buscar..." aria-label="Search">
                <button class="btn btn-outline-secondary" type="submit">Ir</button>
            </form>

            <ul class="navbar-nav ms-auto my-2 my-lg-0 align-items-center">
                <li class="nav-item me-lg-2 my-auto">
                    <a href="#" class="btn btn-outline-dark position-relative border-0 shadow-sm" data-bs-toggle="modal"
                        data-bs-target="#cartModal">
                        <i class="bi bi-cart-fill fs-5"></i> Carrito
                        <span id="contador-carrito" class="badge rounded-pill bg-primary"
                            style="font-size: 0.7rem; display: none;">0</span>
                    </a>
                </li>

                <li class="nav-item d-flex mx-2">
                    <a sec:authorize="isAnonymous()" th:href="@{/iniciar-sesion}"
                        class="btn btn-outline-primary px-4 btn-sm">Iniciar sesión</a>
                </li>
                <li class="nav-item">
                    <a sec:authorize="isAnonymous()" th:href="@{/registrarse}"
                        class="btn btn-primary px-4 btn-sm">Registrarse</a>
                </li>

                <!-- PERFIL DESPLEGABLE -->
                <li sec:authorize="isAuthenticated()" class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle d-flex align-items-center gap-2" href="#" role="button"
                        data-bs-toggle="dropdown" aria-expanded="false">
                        <div class="rounded-circle bg-light d-flex justify-content-center align-items-center me-2"
                            style="width: 32px; height: 32px; border: 1px solid var(--border-medium);">
                            <span>👤</span>
                        </div>
                        <span sec:authentication="principal.usuario.nombres" class="fw-bold"
                            style="font-size: .9rem;"></span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end shadow-sm"
                        style="min-width: 220px; border-radius: var(--radius-medium);">
                        <!-- Avatar + nombre -->
                        <li class="px-3 py-2 text-center border-bottom">
                            <div class="rounded-circle bg-light d-flex justify-content-center align-items-center mx-auto mb-2"
                                style="width: 64px; height: 64px; border: 1px solid var(--border-medium);">
                                <span class="fs-3">👤</span>
                            </div>
                            <small sec:authentication="principal.username" class="text-lowercase">username</small> <br>
                            <small sec:authentication="principal.usuario.email" class="text-lowercase">email</small>
                        </li>
                        <!-- Opciones -->
                        <li><a class="dropdown-item" th:href="@{/mi-cuenta}">👤 Mi cuenta</a></li>
                        <li><a class="dropdown-item" th:href="@{/mi-cuenta/pedidos}">📦 Mis pedidos</a></li>
                        <li>
                            <hr class="dropdown-divider">
                        </li>
                        <!-- Opciones ADMINISTRADOR -->
                        <div sec:authorize="hasAnyRole('EMPLEADO', 'ADMINISTRADOR', 'OWNER')">
                            <li><a class="dropdown-item" th:href="@{/empleado}">
                                    <span><i class="bi bi-receipt"></i></span> PANEL EMPLEADO</a>
                            </li>
                        </div>
                        <div sec:authorize="hasAnyRole('ADMINISTRADOR', 'OWNER')" class="border-bottom">
                            <li><a class="dropdown-item" th:href="@{/admin}">
                                    <span><i class="bi bi-database"></i></span> PANEL ADMIN</a>
                            </li>
                        </div>
                        <li><a class="dropdown-item text-danger" th:href="@{/cerrar-sesion}">Cerrar sesión</a></li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>

    <div th:replace="~{fragments/modals :: carrito}"></div>
</nav>

<!-- NAVBAR DE CATEGORIAS -->
<nav class="navbar navbar-expand-lg border-top bg-light-subtle nav-categorias nav-underline"
    th:fragment="navbarCategorias">
    <div class="container-fluid">
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuCategorias"
            aria-controls="menuCategorias" aria-expanded="false" aria-label="Abrir menú">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse justify-content-center" id="menuCategorias">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}"
                        th:classappend="${currentPath == '/' or currentPath == ''} ? 'active' : ''">Inicio</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" th:href="@{/catalogo}">Ver
                        Todo</a>
                </li>

                <li class="nav-item" th:each="cat : ${categoriasMenu}">
                    <a class="nav-link" th:href="@{'/catalogo/' + ${cat.nombre}}" th:text="${cat.nombre}">Nombre
                        Categoria</a>
                </li>
            </ul>
        </div>
    </div>
</nav>
