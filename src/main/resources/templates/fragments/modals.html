<!-- MODAL CARRITO -->
<div th:fragment="carrito" class="modal fade" id="cartModal" tabindex="-1" aria-hidden="true" data-bs-backdrop="false">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content border-0 rounded-4 shadow">

            <div class="modal-header border-bottom-0 pb-0">
                <h4 class="modal-title fw-bold">Tu carrito de compras</h4>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>

            <div class="modal-body pt-4" id="cuerpo-carrito">

                <div id="lista-carrito-items">
                    <div class="text-center py-5">
                        <i class="bi bi-cart fs-1 text-muted mb-3 d-block"></i>
                        <p class="text-muted">Tu carrito está vacio.</p>
                        <a th:href="@{/catalogo}" class="btn btn-outline-dark btn-sm rounded-pill mt-2"
                            data-bs-dismiss="modal">
                            Empezar a comprar
                        </a>
                    </div>
                </div>

            </div>

            <div
                class="modal-footer border-top-0 d-flex justify-content-between align-items-center bg-light rounded-bottom-4">
                <div>
                    <span class="text-muted small d-block">Total estimado</span>
                    <h4 class="fw-bold mb-0" id="total-carrito">S/. 0.00</h4>
                </div>
                <div>
                    <button class="btn btn-link text-decoration-none text-muted me-2" data-bs-dismiss="modal">Seguir
                        mirando</button>
                    <a th:href="@{/cliente/pagar-carrito}" class="btn btn-primary rounded-pill px-4"
                        id="btn-finalizar-compra">
                        Pagar ahora
                    </a>
                </div>
            </div>

        </div>
    </div>
</div>
