<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/heads :: cabeceraPrincipal('Mis Pedidos')}"></head>

<body class="d-flex flex-column min-vh-100 bg-light">

    <header class="sticky-top">
        <nav th:replace="~{fragments/navbars :: navbarPrincipal}"></nav>
        <!-- <nav th:replace="~{fragments/navbars :: navbarCategorias}"></nav> -->
    </header>

    <main class="flex-grow-1 py-5">
        <div class="container">
            <h2 class="fw-bold mb-4 text-center">Mis Pedidos</h2>

            <div class="card border-0 shadow-sm">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <!-- <thead class="table-light">
                                <tr>
                                    <th class="py-3 ps-4">N° PEDIDO</th>
                                    <th>FECHA</th>
                                    <th>TOTAL</th>
                                    <th>ESTADO</th>
                                    <th class="text-end pe-4">ACCIONES</th>
                                </tr>
                            </thead> -->
                            <tbody>
                                <tr th:each="p : ${pedidos}">
                                    <td class="ps-4 fw-bold text-secondary" th:text="'#' + ${p.idPedido}">#105</td>
                                    <td>
                                        <div th:text="${#temporals.format(p.fechaCreacion, 'dd/MM/yyyy')}">01/01/2024
                                        </div>
                                        <small class="text-muted"
                                            th:text="${#temporals.format(p.fechaCreacion, 'HH:mm')}">14:30</small>
                                    </td>
                                    <td class="fw-bold text-success"
                                        th:text="'S/ ' + ${#numbers.formatDecimal(p.total, 1, 2, 'COMMA')}">S/ 0.00</td>
                                    <td>
                                        <span class="badge rounded-pill"
                                            th:classappend="${p.estadoCompra?.nombre == 'ENTREGADO' ? 'bg-success' : (p.estadoCompra?.nombre == 'CANCELADO' ? 'bg-danger' : 'bg-warning text-dark')}"
                                            th:text="${p.estadoCompra?.nombre}">PENDIENTE</span>
                                    </td>
                                    <td class="text-end pe-4">
                                        <a th:href="@{/mi-cuenta/pedidos/exportar-pdf/{id}(id=${p.idPedido})}" target="_blank"
                                            class="btn btn-sm btn-outline-danger" title="Ver Comprobante">
                                            <i class="bi bi-file-earmark-pdf-fill"></i> Ver comprobante
                                        </a>
                                        <button class="btn btn-outline-primary btn-sm px-3"
                                            th:onclick="'verDetallesPedido(' + ${p.idPedido} + ')'">
                                            <i class="bi bi-eye-fill"></i> Ver Detalles
                                        </button>
                                    </td>
                                </tr>

                                <tr th:if="${#lists.isEmpty(pedidos)}">
                                    <td colspan="5" class="text-center py-5 text-muted">
                                        <i class="bi bi-bag-x fs-1 d-block mb-2"></i>
                                        Aún no has realizado ninguna compra.
                                        <br>
                                        <a th:href="@{/catalogo}" class="btn btn-link mt-2">Ir al catálogo</a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/footers :: footer-secundario}"></footer>

    <div class="modal fade" id="modalDetallePedido" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content" id="contenedorModalDetalle">
                <div class="modal-body text-center py-5">
                    <div class="spinner-border text-primary" role="status"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        function verDetallesPedido(idPedido) {
            const modalEl = document.getElementById('modalDetallePedido');
            const contenedor = document.getElementById('contenedorModalDetalle');
            const modal = new bootstrap.Modal(modalEl);

            // 1. Mostrar modal con spinner
            modal.show();

            // 2. Pedir fragmento al servidor
            fetch(`/mi-cuenta/pedidos/detalle/${idPedido}`)
                .then(response => {
                    if (!response.ok) throw new Error("Error al cargar");
                    return response.text();
                })
                .then(html => {
                    // 3. Reemplazar contenido
                    contenedor.innerHTML = html;
                })
                .catch(err => {
                    contenedor.innerHTML = `<div class="modal-body text-center text-danger"><p>Ocurrió un error al cargar el pedido.</p></div>`;
                });
        }
    </script>
</body>

</html>
